[project]
name = "ugekazna-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config -p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RUF", "S"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "S608"]
"migrations/*" = ["E501"]
"app/etl/synthetic/*" = ["S311"]
# SQL identifikatorlari faqat kod ichidagi reyestrlardan (whitelist) olinadi.
"app/etl/merge.py" = ["S608"]
"app/dwh/*" = ["S608"]
"app/admin/config_service.py" = ["S608"]
"app/admin/etl_router.py" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["pyotp", "pyotp.*", "segno"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apscheduler", "apscheduler.*"]
ignore_missing_imports = true
