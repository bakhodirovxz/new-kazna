# UGEKAZNA CI (spec 10). Hamma tekshiruv Docker'da — runner'ga faqat Docker, Compose, make, git, python3 kerak.
# GitLab CI (.gitlab-ci.yml) aynan shu make target'larni chaqiradi.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # har dushanba 03:00 UTC — yangi CVE'lar uchun qayta skan

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # gitleaks butun tarixni skanerlaydi
          persist-credentials: false
      - name: make check
        run: make check

  e2e:
    needs: check
    # Runner'da bitta ugekazna stack: e2e joblar ketma-ket (e2e_ci.sh down -v qiladi).
    concurrency:
      group: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: make e2e-ci
        run: make e2e-ci
      - name: Playwright hisoboti
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report/
          retention-days: 14

  scan:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: make scan
        run: make scan
      - name: SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: build/sbom/*.cdx.json
          retention-days: 90
