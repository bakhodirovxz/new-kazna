# UGEKAZNA CI (spec 10). Hamma tekshiruv Docker'da — runner'ga faqat Docker, Compose, make, git, python3 kerak.
# GitLab CI (.gitlab-ci.yml) aynan shu make target'larni chaqiradi.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # har dushanba 03:00 UTC — yangi CVE'lar uchun qayta skan

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks butun tarixni skanerlaydi
      - name: make check
        run: make check

  e2e:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: make e2e-ci
        run: make e2e-ci
      - name: Playwright hisoboti
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report/
          retention-days: 14

  scan:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: make scan
        run: make scan
      - name: SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: build/sbom/*.cdx.json
          retention-days: 90
