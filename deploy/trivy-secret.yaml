# Trivy secret-scanner istisnolari (docs/security/sast-exceptions.md). Faqat aniq matn + aniq paket yo'li:
# boshqa joyda yoki boshqa ko'rinishda topilgan gcp-service-account baribir xato beradi.
allow-rules:
  - id: anthropic-sdk-principal-docstring
    description: "anthropic SDK docstring namunasi (service_account turi), kalit emas"
    path: opt/venv/lib/python3\.\d+/site-packages/anthropic/
    regex: '\{"type": "service_account"\}'
