# Dev stack. Faqat caddy tashqi port ochadi, faqat localhost'ga (127.0.0.1:8443).
# Sirlar: python scripts/gen_secrets.py  →  deploy/secrets/
name: ugekazna

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

secrets:
  db_superuser_password: {file: ./secrets/db_superuser_password}
  db_migrator_password: {file: ./secrets/db_migrator_password}
  db_app_password: {file: ./secrets/db_app_password}
  db_etl_password: {file: ./secrets/db_etl_password}
  redis_password: {file: ./secrets/redis_password}
  master_kek: {file: ./secrets/master_kek}
  blind_index_key: {file: ./secrets/blind_index_key}
  session_pepper: {file: ./secrets/session_pepper}
  smtp_password: {file: ./secrets/smtp_password}

services:
  db:
    <<: *hardening
    image: postgres:16-alpine
    user: "70:70"
    group_add: ["10001"]
    pids_limit: 200
    mem_limit: 1g
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ugekazna
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    secrets: [db_superuser_password, db_migrator_password, db_app_password, db_etl_password]
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=70,gid=70,mode=0775
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ugekazna"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    <<: *hardening
    image: redis:7-alpine
    user: "999:1000"
    group_add: ["10001"]
    pids_limit: 50
    mem_limit: 320m
    secrets: [redis_password]
    tmpfs: ["/tmp:mode=1777"]
    command:
      - sh
      - -c
      - >-
        umask 077 &&
        printf 'requirepass %s\n' "$$(cat /run/secrets/redis_password)" > /tmp/redis.conf &&
        exec redis-server /tmp/redis.conf --save '' --appendonly no
        --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks: [backend]
    healthcheck:
      # `REDISCLI_AUTH` (env) orqali — `-a` flag'dan farqli o'laroq, parol boshqa
      # jarayonlarga oddiy `ps aux` orqali ko'rinmaydi (argv emas, env).
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    <<: *hardening
    restart: "no"
    build: {context: ../backend, args: {INSTALL_DEV: "true"}}
    image: ugekazna-backend:dev
    user: "10001:10001"
    pids_limit: 100
    mem_limit: 512m
    environment: {ENV: dev}
    secrets: [db_migrator_password, db_app_password, master_kek, blind_index_key, session_pepper]
    command: ["alembic", "upgrade", "head"]
    tmpfs: [/tmp]
    networks: [backend]
    depends_on:
      db: {condition: service_healthy}

  api:
    <<: *hardening
    image: ugekazna-backend:dev
    user: "10001:10001"
    pids_limit: 100
    mem_limit: 512m
    environment:
      ENV: dev
      BASE_URL: https://localhost:8443
      WATCHFILES_FORCE_POLLING: "true"
      # S5: dev'da AI — soxta provayder (tarmoqqa chiqmaydi). Baribir `ai.enabled` yoqilmaguncha o'chiq.
      AI_PROVIDER: fake
    secrets: [db_app_password, redis_password, master_kek, blind_index_key, session_pepper]
    volumes:
      - ../backend/app:/app/app:ro
    tmpfs: [/tmp]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload",
              "--proxy-headers", "--forwarded-allow-ips", "172.31.251.0/24", "--no-server-header", "--no-access-log"]
    # `edge`da EMAS — faqat `backend` (DB/Redis) va `front` (faqat caddy bilan, ikkalasi
    # ham `internal: true`). Caddy hostga `edge` orqali chiqadi, api hech qachon shu
    # tarmoqqa tegmaydi (kamroq blast radius).
    networks: [backend, front]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    <<: *hardening
    image: ugekazna-backend:dev
    user: "10001:10001"
    pids_limit: 100
    mem_limit: 512m
    environment:
      ENV: dev
      ETL_FILE_DIR: /data/inbox
      # SMTP_HOST / SMTP_TO / SMTP_FROM — ichki relay bo'lsa shu yerda beriladi.
      # `backend` tarmog'i `internal: true` — tashqi relay kerak bo'lsa alohida
      # egress tarmog'i talab qilinadi (4-reja).
    secrets: [db_app_password, db_etl_password, redis_password, master_kek, blind_index_key,
              session_pepper, smtp_password]
    volumes:
      - ../backend/app:/app/app:ro
      - etl_inbox:/data/inbox:ro
    tmpfs: [/tmp]
    command: ["python", "-m", "app.worker"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, time, sys; sys.exit(0 if time.time() - os.stat('/tmp/worker-heartbeat').st_mtime < 180 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  caddy:
    <<: *hardening
    build: {context: ../frontend, target: web}
    image: ugekazna-web:dev
    cap_add: [NET_BIND_SERVICE]
    pids_limit: 50
    mem_limit: 128m
    # Faqat localhost'ga — tashqi tarmoqdan (masalan, LAN) 8443'ga to'g'ridan-to'g'ri
    # kirish yo'q.
    ports: ["127.0.0.1:8443:443"]
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # `edge` — hostga chiqish uchun (port mapping `internal: true` tarmoqda ishlamaydi);
    # `front` — faqat `api`ga (ikkalasi ham shu yerda, boshqa hech kim yo'q).
    networks: [front, edge]
    depends_on: [api]

networks:
  backend:
    internal: true
  front:
    internal: true
    ipam:
      config: [{subnet: 172.31.251.0/24}]
  edge: {}

volumes:
  db_data:
  caddy_data:
  caddy_config:
  etl_inbox:
